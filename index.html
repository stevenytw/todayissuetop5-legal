<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>투데이이슈 정책 문서</title>
<style>
  :root {
    --bg: #ffffff;
    --surface: #f3f4f7;
    --ink: #12141c;
    --ink-soft: #4b4f5b;
    --ink-faint: #767a86;
    --accent: #a5761f;
    --accent-strong: #7a5a1e;
    --line: #dcdde3;
    --line-strong: #c6c8d1;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d0f14;
      --surface: #171a21;
      --ink: #e9eaef;
      --ink-soft: #a6a9b4;
      --ink-faint: #767b88;
      --accent: #d9a73c;
      --accent-strong: #e9be5e;
      --line: #262933;
      --line-strong: #333743;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0d0f14;
    --surface: #171a21;
    --ink: #e9eaef;
    --ink-soft: #a6a9b4;
    --ink-faint: #767b88;
    --accent: #d9a73c;
    --accent-strong: #e9be5e;
    --line: #262933;
    --line-strong: #333743;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    background: var(--bg);
    color: var(--ink);
    margin: 0;
    font-family: "Noto Sans KR", "Pretendard", -apple-system, sans-serif;
    line-height: 1.7;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 56px 24px 96px; }
  .masthead {
    border-top: 3px solid var(--ink);
    border-bottom: 1px solid var(--line-strong);
    padding: 18px 0 20px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .masthead-word {
    font-family: "Gothic A1", sans-serif;
    font-weight: 800;
    font-size: 20px;
    letter-spacing: -0.02em;
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .masthead-word .en {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.14em;
    color: var(--accent);
    text-transform: uppercase;
  }
  .masthead-meta {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 12px;
    color: var(--ink-faint);
    text-align: right;
    line-height: 1.6;
  }
  h1 {
    font-family: "Gothic A1", "Noto Sans KR", sans-serif;
    font-weight: 800;
    font-size: 30px;
    letter-spacing: -0.01em;
    margin: 40px 0 12px;
    text-wrap: balance;
  }
  .lede { color: var(--ink-soft); max-width: 60ch; margin: 0 0 40px; }
  .list { display: flex; flex-direction: column; gap: 1px; border-top: 1px solid var(--line); }
  .list a {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 22px 4px;
    border-bottom: 1px solid var(--line);
    color: var(--ink);
    text-decoration: none;
  }
  .list a:hover { color: var(--accent-strong); }
  .list .title { font-family: "Gothic A1", sans-serif; font-weight: 800; font-size: 17px; }
  .list .arrow {
    font-family: "IBM Plex Mono", monospace;
    color: var(--ink-faint);
    font-size: 14px;
  }
  footer {
    margin-top: 48px;
    padding-top: 28px;
    border-top: 1px solid var(--line);
    font-size: 13.5px;
    color: var(--ink-faint);
  }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@700;800&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
</head>
<body>
<div class="wrap">

  <div class="masthead">
    <div class="masthead-word">
      <span class="ko">투데이이슈</span>
      <span class="en">Today Issue Top5 / Top20</span>
    </div>
    <div class="masthead-meta">youtube.com/@Todayissuetop20</div>
  </div>

  <h1>정책 문서</h1>
  <p class="lede">
    유튜브 채널 투데이이슈(Today Issue Top5 / Top20)의 개인정보처리방침과
    서비스 약관입니다.
  </p>

  <div class="list">
    <a href="./privacy.html">
      <span class="title">개인정보처리방침</span>
      <span class="arrow">Privacy Policy →</span>
    </a>
    <a href="./terms.html">
      <span class="title">서비스 약관</span>
      <span class="arrow">Terms of Service →</span>
    </a>
  </div>

  <footer>투데이이슈 · Today Issue Top5 / Top20 · 최종 수정: 2026-09-11</footer>

</div>
</body>
</html>
